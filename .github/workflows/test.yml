name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack
      - run: mkdir -p dist/consumer && cp scripts/smoke-package.mjs dist/consumer/smoke.mjs
      - run: npm install --prefix dist/consumer ./all-str-gen-2.1.3.tgz --ignore-scripts --no-audit --no-fund
      - run: node dist/consumer/smoke.mjs
